<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta de Orçamento</title>
<style>
  :root { --bg:#000; --fg:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden; font-family:system-ui, sans-serif; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; }
  video { position:absolute; width:100%; height:100%; object-fit:contain; opacity:0; visibility:hidden; transition:opacity .5s ease; background:#000; }
  video.active { opacity:1; visibility:visible; }
  .nav { position:fixed; top:0; bottom:0; width:18%; z-index:5; cursor:pointer; background:none; border:0; }
  .nav.prev { left:0; } .nav.next { right:0; }
  .nav:focus-visible { outline:2px solid #fff; outline-offset:-4px; }
  .bar { position:fixed; left:0; right:0; bottom:0; height:4px; display:flex; gap:4px; z-index:6; padding:0 4px 4px; }
  .bar i { flex:1; background:rgba(255,255,255,.25); border-radius:2px; overflow:hidden; }
  .bar i b { display:block; height:100%; width:0; background:#fff; }
  .bar i.done b { width:100%; }
  .err { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7; max-width:min(90vw,640px); text-align:center; font:500 clamp(14px,1.6vw,20px)/1.5 system-ui,sans-serif; color:#fff; background:rgba(0,0,0,.85); padding:1em 1.4em; border:1px solid rgba(255,255,255,.3); border-radius:8px; display:none; }
  .err.show { display:block; }
  .start { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#000; cursor:pointer; border:0; color:#fff; font:600 clamp(18px,2.2vw,28px)/1.4 system-ui,sans-serif; text-align:center; }
  .start small { display:block; margin-top:.8em; font-weight:400; font-size:.6em; opacity:.6; }
  .start.hide { display:none; }
  @media (prefers-reduced-motion: reduce){ video{ transition:none; } }
</style>
</head>
<body>
<button class="start" id="start" aria-label="Iniciar apresentação">
  <span>Clique para iniciar<small>← → ou espaço para navegar · F para tela cheia</small></span>
</button>

<main class="stage" id="stage">
  <video data-name="Primeiro_Slide" playsinline preload="auto"></video>
  <video data-name="Segundo_Slide" playsinline preload="auto"></video>
  <video data-name="Logo-Animada" playsinline preload="auto"></video>
</main>

<button class="nav prev" id="prev" aria-label="Slide anterior"></button>
<button class="nav next" id="next" aria-label="Próximo slide"></button>
<div class="bar" id="bar"></div>
<div class="err" id="err" role="alert"></div>

<script>
(function(){
  var vids = Array.prototype.slice.call(document.querySelectorAll('video'));
  var bar = document.getElementById('bar');
  var cur = -1, raf;

  vids.forEach(function(){ var s=document.createElement('i'); s.appendChild(document.createElement('b')); bar.appendChild(s); });
  var segs = Array.prototype.slice.call(bar.children);
  var err = document.getElementById('err');
  var failed = {};

  // aceita variações de nome (underscore, espaço, hífen) caso o arquivo tenha sido renomeado no download
  vids.forEach(function(v, i){
    var base = v.getAttribute('data-name');
    var names = [base, base.replace(/_/g,' '), base.replace(/_/g,'-'), base.replace(/_/g,'%20')];
    var seen = {};
    names.forEach(function(n, k){
      if (seen[n]) return; seen[n] = 1;
      var src = document.createElement('source');
      src.src = (n.indexOf('%')>-1 ? n : encodeURI(n)) + '.mp4';
      src.type = 'video/mp4';
      if (k === names.length - 1) src.addEventListener('error', function(){ failed[i] = base + '.mp4'; if (cur === i) showErr(); });
      v.appendChild(src);
    });
    v.addEventListener('error', function(){ failed[i] = base + '.mp4'; if (cur === i) showErr(); });
  });

  function showErr(){
    err.textContent = 'Não encontrei o arquivo "' + failed[cur] + '" na mesma pasta do index.html. Confira se o nome está exatamente assim.';
    err.classList.add('show');
  }

  function tick(){
    var v = vids[cur];
    if (v && v.duration) segs[cur].firstChild.style.width = (v.currentTime / v.duration * 100) + '%';
    raf = requestAnimationFrame(tick);
  }

  function go(n){
    if (n < 0 || n >= vids.length) return;
    cancelAnimationFrame(raf);
    vids.forEach(function(v,i){
      if (i === n) {
        v.currentTime = 0;
        v.classList.add('active');
        var p = v.play(); if (p && p.catch) p.catch(function(){});
      } else {
        v.classList.remove('active');
        v.pause();
      }
    });
    segs.forEach(function(s,i){
      s.classList.toggle('done', i < n);
      if (i > n) s.firstChild.style.width = '0';
    });
    cur = n;
    err.classList.remove('show');
    if (failed[n]) showErr();
    tick();
  }

  function next(){ go(cur + 1); }
  function prev(){ go(cur - 1); }

  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('start').onclick = function(){
    this.classList.add('hide');
    go(0);
  };

  vids.forEach(function(v,i){
    v.addEventListener('ended', function(){ if (i === cur) segs[i].firstChild.style.width = '100%'; });
  });

  function fs(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  document.addEventListener('keydown', function(e){
    if (cur < 0 && (e.key === ' ' || e.key === 'Enter')) { document.getElementById('start').click(); e.preventDefault(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(vids.length - 1);
    else if (e.key === 'f' || e.key === 'F') fs();
  });

  var x0 = null;
  document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) (dx < 0 ? next : prev)();
    x0 = null;
  });
})();
</script>
</body>
</html>
